name: Eval nightly

on:
  schedule:
    # 02:00 Asia/Shanghai（18:00 UTC），每天一次
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout agent-eval
        uses: actions/checkout@v4

      - name: Checkout WFXM (product under test)
        uses: actions/checkout@v4
        with:
          repository: XiaZiHunDun/WFXM
          path: wfxm
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install WFXM dependencies
        working-directory: wfxm
        run: pnpm install --frozen-lockfile

      - name: Framework unit tests
        run: npm test

      - name: L3 trajectory suite (deterministic fixtures)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
        run: node src/cli.mjs run --suite trajectory --runtime wfxm

      - name: Legacy scenario suite (converted from vitest)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
        run: node src/cli.mjs run --suite legacy --runtime wfxm

      # 确定性 gate + RAG 检索门禁（真实模型）。RAG 检索指标与任务通过率分开判定。
      # 无密钥时退化为纯确定性 gate，不影响其他步骤。
      - name: Multi-metric gate (baseline + butler + golden + adversarial + rag)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          BUTLER_V5_MODEL_PLAN: deepseek-flash
          BUTLER_V5_MODEL_EXEC: deepseek-flash
          BUTLER_V5_MODEL_INTAKE: deepseek-flash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY 未配置，RAG 门禁降级为确定性 gate"
            node src/cli.mjs gate
            exit 0
          fi
          node src/cli.mjs gate --with-rag --real --repeats 1

      # 先观测软性评分（judge 低分不阻断）；稳定两周后把 --judge-observe 改成 --judge。
      - name: L4 open tasks (real model + judge observe)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          JUDGE_MODEL: deepseek-flash
          BUTLER_V5_MODEL_PLAN: deepseek-flash
          BUTLER_V5_MODEL_EXEC: deepseek-flash
          BUTLER_V5_MODEL_INTAKE: deepseek-flash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY 未配置，跳过真实模型任务"
            exit 0
          fi
          node src/cli.mjs run --suite butler-open --runtime wfxm --real --judge-observe

      # 真实模型开发能力子集：10 条 code-edit/debug/planning，2 次重复。
      # 默认模型 DeepSeek Flash，基线阈值 0.90（实测 100%）。
      - name: Real-model dev subset (10 capability tasks)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          BUTLER_V5_MODEL_PLAN: deepseek-flash
          BUTLER_V5_MODEL_EXEC: deepseek-flash
          BUTLER_V5_MODEL_INTAKE: deepseek-flash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY 未配置，跳过真实模型子集"
            exit 0
          fi
          node src/cli.mjs run --suite capability --runtime wfxm --real --repeats 2 \
            --tasks cap-code-edit-clamp,cap-code-edit-parse-duration,cap-code-edit-port-env,cap-code-edit-slugify,cap-debug-async-await,cap-debug-loop-bound,cap-debug-null-guard,cap-debug-range-end,cap-planning-env-migration,cap-planning-release-order \
            --out .eval-runs/capability-real \
            --baseline baselines/capability-real.json

      # 仓库修复集：5 条 repo-task（failToPass + passToPass），覆盖真实改码闭环。
      # 2026-11-19 实跑 5/5×2，基线阈值 0.80。
      - name: Real-model repo-task suite (5 tasks)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          BUTLER_V5_MODEL_PLAN: deepseek-flash
          BUTLER_V5_MODEL_EXEC: deepseek-flash
          BUTLER_V5_MODEL_INTAKE: deepseek-flash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY 未配置，跳过 repo 修复集"
            exit 0
          fi
          node src/cli.mjs run --suite repo --runtime wfxm --real --repeats 2 \
            --out .eval-runs/repo-real \
            --baseline baselines/repo-real.json

      # 真实模型 heldout 子集：11 条更难任务，用于观察模型区分度。
      # 2026-11-19 选型：DeepSeek Flash 原 6 条 6/6；扩到 11 条后实测 95.5%。
      # 基线阈值 0.90（容忍一条任务抖动）。
      - name: Real-model heldout subset (11 harder tasks)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          BUTLER_V5_MODEL_PLAN: deepseek-flash
          BUTLER_V5_MODEL_EXEC: deepseek-flash
          BUTLER_V5_MODEL_INTAKE: deepseek-flash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY 未配置，跳过 heldout 子集"
            exit 0
          fi
          node src/cli.mjs run --suite heldout --runtime wfxm --real --repeats 2 \
            --out .eval-runs/heldout-real \
            --baseline baselines/heldout-real.json

      # dsh-wfxm 真实能力基线：需要 runner 上有 dsh 与它的 credentials 服务。
      # 观察期至 2026-12-08（+08）：此前 advisory（写 gate.json 不阻断）；
      # 之后自动硬门禁，capability 阈值 0.8；DSH_EVAL_HARD_GATE=1 可提前切换。
      - name: dsh capability baseline (real model)
        env:
          AGENT_EVAL_REAL_MODEL: "1"
          DSH_WFXM_ROOT: ${{ vars.DSH_WFXM_ROOT }}
        run: |
          if ! command -v dsh >/dev/null 2>&1; then
            echo "::warning::dsh 不可用，跳过多端能力基线"
            exit 0
          fi
          if [ ! -d "${DSH_WFXM_ROOT:-}" ]; then
            echo "::warning::DSH_WFXM_ROOT 未配置，跳过 dsh 能力基线"
            exit 0
          fi
          ADVISORY="--advisory"
          if [ "$(date -u +%s)" -ge 1796659200 ] || [ "${DSH_EVAL_HARD_GATE:-}" = "1" ]; then
            ADVISORY=""
          fi
          node src/cli.mjs gate --runtime dsh-wfxm --with-capability --with-repo --with-conversation --real --min-capability 0.8 $ADVISORY

      - name: Upload eval runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs-${{ github.run_id }}
          path: .eval-runs
          if-no-files-found: warn
