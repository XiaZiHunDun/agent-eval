name: Eval PR smoke

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: eval-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout agent-eval
        uses: actions/checkout@v4

      - name: Checkout WFXM (product under test)
        uses: actions/checkout@v4
        with:
          repository: XiaZiHunDun/WFXM
          path: wfxm
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install WFXM dependencies
        working-directory: wfxm
        run: pnpm install --frozen-lockfile

      - name: Framework unit tests
        run: npm test

      - name: Golden smoke (first 5, deterministic fixtures)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
        run: node src/cli.mjs run --suite golden --runtime wfxm --limit 5

      - name: Adversarial suite (tamper / false success / honest stop)
        env:
          WFXM_ROOT: ${{ github.workspace }}/wfxm
        run: node src/cli.mjs run --suite adversarial --runtime wfxm

      - name: Upload eval runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-pr-${{ github.run_id }}
          path: .eval-runs
          if-no-files-found: warn
